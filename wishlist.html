<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ORIGINS — Saved pieces</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#19221e;--muted:#68736d;--cream:#f6f4ef;--lime:#d9ff48;--line:#d9ddd6;--white:#fff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif}.announcement{height:35px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font:11px 'DM Mono';letter-spacing:.08em;text-transform:uppercase}.announcement b{color:var(--lime);font-weight:500;margin-right:9px}.nav{height:85px;padding:0 clamp(20px,5vw,76px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(246,244,239,.93);position:sticky;top:0;z-index:20;backdrop-filter:blur(10px)}.brand{font:700 25px 'DM Sans';letter-spacing:-.09em;color:var(--ink);text-decoration:none}.brand span{font-family:'Playfair Display';font-weight:600;font-style:italic;letter-spacing:-.1em}.nav-links{display:flex;gap:28px}.nav a,.nav-actions button{color:var(--ink);font:500 12px 'DM Mono';letter-spacing:.05em;text-decoration:none;text-transform:uppercase;border:0;background:transparent;cursor:pointer}.nav-actions{display:flex;align-items:center;gap:19px}.bag{position:relative}.bag-count{background:var(--lime);font-size:9px;padding:2px 5px;border-radius:8px;position:absolute;top:-10px;right:-10px;display:none}.page{padding:clamp(54px,9vw,112px) clamp(20px,5vw,76px) 110px;min-height:calc(100vh - 120px)}.eyebrow{font:11px 'DM Mono';letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:20px}.head{display:flex;align-items:end;justify-content:space-between;gap:25px;margin-bottom:42px}.head h1{font:600 clamp(47px,5.5vw,79px)/.9 'Playfair Display';letter-spacing:-.07em;margin:0}.head h1 i{font-weight:500}.head p{font-size:14px;line-height:1.5;color:var(--muted);max-width:260px;margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{position:relative;color:var(--ink);text-decoration:none}.image{background:#e2e0d8;aspect-ratio:.78;overflow:hidden;position:relative}.image img{width:100%;height:100%;object-fit:cover;transition:.4s}.card:hover img{transform:scale(1.04)}.remove{position:absolute;right:12px;top:12px;width:34px;height:34px;background:#fff;border:0;border-radius:50%;font-size:19px;line-height:1;cursor:pointer;z-index:2;color:var(--ink)}.info{padding-top:12px;display:flex;justify-content:space-between;gap:10px}.name{font-size:14px;font-weight:600}.meta{font-size:12px;color:var(--muted);margin-top:4px}.price{font:500 12px 'DM Mono';white-space:nowrap}.empty{border-top:1px solid var(--line);padding:65px 0;text-align:center}.empty h2{font:500 42px/1 'Playfair Display';letter-spacing:-.06em;margin:0 0 14px}.empty p{color:var(--muted);font-size:14px;margin:0 0 25px}.button{display:inline-block;padding:16px 21px;background:var(--ink);border:1px solid var(--ink);color:#fff;text-decoration:none;font:11px 'DM Mono';letter-spacing:.06em;text-transform:uppercase}.footer{padding:28px clamp(20px,5vw,76px);background:#e7e4db;display:flex;justify-content:space-between;font:10px 'DM Mono';color:var(--muted);text-transform:uppercase;letter-spacing:.04em}@media(max-width:800px){.nav{height:70px}.nav-links{display:none}.announcement{font-size:9px}.page{padding:55px 20px 75px}.head{display:block;margin-bottom:31px}.head h1{font-size:53px}.head p{margin-top:18px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.footer{font-size:9px;gap:12px}}
</style>
</head>
<body><div class="announcement"><b>Free delivery</b> on South African orders over R1,200</div><nav class="nav"><a class="brand" href="index.html">ORI<span>G</span>INS</a><div class="nav-links"><a href="index.html#shop">New arrivals</a><a href="index.html#shop">Shop all</a><a href="index.html#story">Our story</a><a href="contact.html">Contact</a></div><div class="nav-actions"><a href="search.html">Search</a><a href="account.html">Account</a><a href="wishlist.html">Saved</a><button class="bag" onclick="goBag()">Bag <span class="bag-count" id="bagCount">0</span></button></div></nav><main class="page"><div class="head"><div><div class="eyebrow">Your edit</div><h1>Pieces you’ve<br><i>kept close.</i></h1></div><p id="countCopy">A small shortlist is a very good place to start.</p></div><section class="grid" id="grid"></section></main><footer class="footer"><span>© 2026 Origins Studio</span><span>Made with intention in South Africa</span><span>Instagram · <a href="contact.html">Contact</a></span></footer><script>
const money=n=>'R'+Number(n).toLocaleString('en-ZA');let saved=JSON.parse(localStorage.getItem('origins-wishlist')||'[]');let cart=JSON.parse(localStorage.getItem('origins-cart')||'[]');function updateBag(){let b=document.getElementById('bagCount');b.textContent=cart.length;b.style.display=cart.length?'block':'none'}function goBag(){location.href=cart.length?'checkout.html':'index.html#shop'}function render(){let grid=document.getElementById('grid'),copy=document.getElementById('countCopy');copy.textContent=saved.length?`${saved.length} piece${saved.length===1?'':'s'} saved for whenever the timing is right.`:'A small shortlist is a very good place to start.';if(!saved.length){grid.style.display='block';grid.innerHTML='<div class="empty"><h2>Nothing saved yet.</h2><p>Good pieces have a habit of finding their way back to you.</p><a class="button" href="index.html#shop">Explore the edit →</a></div>';return}grid.style.display='grid';grid.innerHTML=saved.map(p=>`<article class="card"><button class="remove" onclick="removeItem(${p.id})" aria-label="Remove ${p.name}">×</button><a href="product.html?id=${p.id}" class="card"><div class="image"><img src="${p.img}" alt="${p.name}"></div><div class="info"><div><div class="name">${p.name}</div><div class="meta">${p.detail}</div></div><div class="price">${money(p.price)}</div></div></a></article>`).join('')}function removeItem(id){saved=saved.filter(p=>p.id!==id);localStorage.setItem('origins-wishlist',JSON.stringify(saved));render()}updateBag();render();
</script></body></html>
