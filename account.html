<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ORIGINS — My account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#19221e;--muted:#68736d;--cream:#f6f4ef;--warm:#ebe7de;--lime:#d9ff48;--line:#d9ddd6;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif}.announcement{height:35px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font:11px 'DM Mono';letter-spacing:.08em;text-transform:uppercase}.announcement b{color:var(--lime);font-weight:500;margin-right:9px}.nav{height:85px;padding:0 clamp(20px,5vw,76px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(246,244,239,.93);position:sticky;top:0;z-index:20;backdrop-filter:blur(10px)}.brand{font:700 25px 'DM Sans';letter-spacing:-.09em;color:var(--ink);text-decoration:none}.brand span{font-family:'Playfair Display';font-weight:600;font-style:italic;letter-spacing:-.1em}.nav-links{display:flex;gap:28px}.nav a,.nav-actions button{color:var(--ink);font:500 12px 'DM Mono';letter-spacing:.05em;text-decoration:none;text-transform:uppercase;border:0;background:transparent;cursor:pointer}.nav-actions{display:flex;align-items:center;gap:19px}.bag{position:relative}.bag-count{background:var(--lime);font-size:9px;padding:2px 5px;border-radius:8px;position:absolute;top:-10px;right:-10px;display:none}.auth{max-width:1080px;margin:0 auto;padding:clamp(56px,10vw,120px) 20px;display:grid;grid-template-columns:1fr 1fr;gap:clamp(35px,9vw,140px);min-height:calc(100vh - 120px)}.intro .eyebrow,.dash .eyebrow{font:11px 'DM Mono';letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:20px}.intro h1,.dash h1{font:600 clamp(44px,5.4vw,76px)/.91 'Playfair Display';letter-spacing:-.07em;margin:0}.intro h1 i,.dash h1 i{font-weight:500}.intro p{font-size:15px;line-height:1.62;color:var(--muted);max-width:350px;margin:26px 0}.perks{border-top:1px solid var(--line);max-width:340px;margin-top:37px}.perk{display:flex;gap:12px;border-bottom:1px solid var(--line);padding:14px 0;font-size:13px}.perk span{font:11px 'DM Mono';color:var(--muted)}.auth-card{background:var(--white);border:1px solid var(--line);align-self:start;padding:clamp(24px,4vw,42px)}.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:27px}.tab{padding:0 0 13px;margin-right:24px;border:0;background:none;font:500 12px 'DM Mono';cursor:pointer;color:var(--muted)}.tab.active{color:var(--ink);border-bottom:2px solid var(--ink)}.auth-card h2{font:600 29px 'Playfair Display';letter-spacing:-.04em;margin:0 0 8px}.auth-card > p{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 22px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:8px}.field.full{grid-column:span 2}.field label{font:10px 'DM Mono';letter-spacing:.06em;color:var(--muted)}.field input{height:49px;border:1px solid var(--line);background:#fff;padding:0 13px;color:var(--ink);outline:none;font:13px 'DM Sans';border-radius:0}.field input:focus{border-color:var(--ink)}.submit{width:100%;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:17px;margin-top:22px;font:500 11px 'DM Mono';letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:.2s}.submit:hover{background:#2c3832;transform:translateY(-2px)}.small-note{font:10px 'DM Mono';color:var(--muted);line-height:1.55;text-align:center;margin:15px 0 0}.dash{max-width:1110px;margin:0 auto;padding:63px 20px 100px}.dash-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:44px}.dash-head h1{font-size:clamp(44px,5.4vw,76px)}.logout{border:1px solid var(--line);background:transparent;padding:11px 13px;font:11px 'DM Mono';cursor:pointer}.dashboard-grid{display:grid;grid-template-columns:.82fr 1.18fr;gap:17px}.panel{background:var(--white);border:1px solid var(--line);padding:27px}.panel.wide{grid-column:span 2}.panel h2{font:600 26px 'Playfair Display';letter-spacing:-.045em;margin:0 0 20px}.profile-name{font:600 18px 'DM Sans';margin:0 0 6px}.profile-email{font:12px 'DM Mono';color:var(--muted);margin:0 0 22px}.text-button{border:0;background:none;padding:0;color:var(--ink);font:11px 'DM Mono';text-decoration:underline;text-underline-offset:4px;cursor:pointer}.order-empty{border-top:1px solid var(--line);padding:31px 0 5px;color:var(--muted);font-size:13px;line-height:1.55}.order-row{border-top:1px solid var(--line);padding:17px 0;display:flex;justify-content:space-between;gap:15px}.order-row:last-child{padding-bottom:0}.order-row b{font:600 13px 'DM Sans';display:block;margin-bottom:5px}.order-row span{font:10px 'DM Mono';color:var(--muted)}.order-price{font:12px 'DM Mono';color:var(--ink)!important;white-space:nowrap}.address{font-size:13px;color:var(--muted);line-height:1.65;border-top:1px solid var(--line);padding-top:18px}.footer{padding:28px clamp(20px,5vw,76px);background:#e7e4db;display:flex;justify-content:space-between;font:10px 'DM Mono';color:var(--muted);text-transform:uppercase;letter-spacing:.04em}@media(max-width:760px){.nav{height:70px}.nav-links{display:none}.announcement{font-size:9px}.auth{grid-template-columns:1fr;padding:56px 20px 70px}.intro h1,.dash h1{font-size:53px}.intro{display:none}.dashboard-grid{grid-template-columns:1fr}.panel.wide{grid-column:auto}.dash{padding:46px 20px 70px}.dash-head{align-items:start;flex-direction:column;margin-bottom:30px}.footer{font-size:9px;gap:13px}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}} 
  </style>
</head>
<body>
<div class="announcement"><b>Free delivery</b> on South African orders over R1,200</div>
<nav class="nav"><a class="brand" href="index.html">ORI<span>G</span>INS</a><div class="nav-links"><a href="index.html#shop">New arrivals</a><a href="index.html#shop">Shop all</a><a href="index.html#story">Our story</a></div><div class="nav-actions"><a href="search.html">Search</a><a href="account.html">Account</a><a href="wishlist.html">Saved</a><button class="bag" onclick="goBag()">Bag <span class="bag-count" id="bagCount">0</span></button></div></nav>
<main id="app"></main>
<footer class="footer"><span>© 2026 Origins Studio</span><span>Made with intention in South Africa</span><span>Instagram · Contact</span></footer>
<script>
const app=document.getElementById('app');let account=JSON.parse(localStorage.getItem('origins-account')||'null');let orders=JSON.parse(localStorage.getItem('origins-orders')||'[]');let cart=JSON.parse(localStorage.getItem('origins-cart')||'[]');const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const money=n=>'R'+Number(n||0).toLocaleString('en-ZA');function updateBag(){let b=document.getElementById('bagCount');b.textContent=cart.length;b.style.display=cart.length?'block':'none'}function goBag(){location.href=cart.length?'checkout.html':'index.html#shop'}function auth(){app.innerHTML=`<section class="auth"><div class="intro"><div class="eyebrow">ORIGINS account</div><h1>Good things,<br><i>kept close.</i></h1><p>Save your details, keep an eye on your orders and move through checkout with less fuss. Quite civilised, really.</p><div class="perks"><div class="perk"><span>01</span> Faster checkout</div><div class="perk"><span>02</span> Order history in one place</div><div class="perk"><span>03</span> Early access to small runs</div></div></div><form class="auth-card" onsubmit="submitAuth(event)"><div class="tabs"><button type="button" class="tab active" onclick="setMode('signin',this)">SIGN IN</button><button type="button" class="tab" onclick="setMode('create',this)">CREATE ACCOUNT</button></div><h2 id="authTitle">Welcome back.</h2><p id="authCopy">Sign in to see your orders and saved details.</p><div class="fields"><div class="field full" id="nameField" style="display:none"><label>FIRST NAME</label><input id="name" placeholder="Your first name"></div><div class="field full"><label>EMAIL ADDRESS</label><input id="authEmail" type="email" placeholder="you@email.com" required></div><div class="field full"><label>PASSWORD</label><input id="password" type="password" placeholder="••••••••" minlength="4" required></div></div><button class="submit" id="authSubmit">Sign in →</button><p class="small-note" id="authNote">Demo mode: any email and password work here.</p></form></section>`;app.dataset.mode='signin'}function setMode(mode,el){app.dataset.mode=mode;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');let create=mode==='create';document.getElementById('nameField').style.display=create?'flex':'none';document.getElementById('authTitle').textContent=create?'Make it yours.':'Welcome back.';document.getElementById('authCopy').textContent=create?'Create an account for easier orders and first word on new drops.':'Sign in to see your orders and saved details.';document.getElementById('authSubmit').textContent=create?'Create account →':'Sign in →';document.getElementById('authNote').textContent=create?'We only use these details for this demo store.':'Demo mode: any email and password work here.'}function submitAuth(e){e.preventDefault();let email=document.getElementById('authEmail').value.trim(),name=document.getElementById('name').value.trim();if(app.dataset.mode==='create'&&!name){document.getElementById('name').focus();return}if(!account){account={name:name||email.split('@')[0].replace(/[._-]/g,' '),email,address:''}}else{account.email=email;if(name)account.name=name}localStorage.setItem('origins-account',JSON.stringify(account));dashboard()}function dashboard(){let shownOrders=orders.length?orders:[];app.innerHTML=`<section class="dash"><div class="dash-head"><div><div class="eyebrow">Your ORIGINS account</div><h1>Hi, <i>${esc(account.name.split(' ')[0])}.</i></h1></div><button class="logout" onclick="logout()">SIGN OUT</button></div><div class="dashboard-grid"><section class="panel"><h2>Your details</h2><p class="profile-name">${esc(account.name)}</p><p class="profile-email">${esc(account.email)}</p><button class="text-button" onclick="editProfile()">Edit profile →</button></section><section class="panel"><h2>Delivery address</h2><div class="address" id="addressText">${account.address?esc(account.address).replace(/\n/g,'<br>'):'No saved address yet — add one now and checkout will feel pleasingly brief.'}</div><button class="text-button" style="margin-top:18px" onclick="editAddress()">${account.address?'Edit address':'Add address'} →</button></section><section class="panel wide"><h2>Your orders</h2><div class="orders">${shownOrders.length?shownOrders.map(o=>`<div class="order-row"><div><b>${esc(o.number)}</b><span>${esc(o.date)} · ${o.items} item${o.items===1?'':'s'} · ${esc(o.status||'Order confirmed')}</span></div><span class="order-price">${money(o.total)}</span></div>`).join(''):'<div class="order-empty">No orders yet. The edit is waiting when you are.<br><a href="index.html#shop" style="color:var(--ink);display:inline-block;margin-top:10px">Shop new arrivals →</a></div>'}</div></section></div></section>`}function editProfile(){let name=prompt('Your name',account.name);if(name===null)return;let email=prompt('Your email address',account.email);if(email===null)return;account.name=name.trim()||account.name;account.email=email.trim()||account.email;localStorage.setItem('origins-account',JSON.stringify(account));dashboard()}function editAddress(){let current=account.address||'';let address=prompt('Delivery address',current);if(address===null)return;account.address=address.trim();localStorage.setItem('origins-account',JSON.stringify(account));dashboard()}function logout(){localStorage.removeItem('origins-account');account=null;auth()}updateBag();account?dashboard():auth();
</script></body></html>
